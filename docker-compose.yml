services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinic_postgres
    restart: always
    environment:
      POSTGRES_DB: clinic_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: